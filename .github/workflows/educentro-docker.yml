name: Educentro Docker (compose)

# Prueba REAL de la imagen y del compose (en este entorno de desarrollo no hay Docker). Solo corre al tocar
# lo que afecta a Docker; repositorio privado: minutos limitados.
on:
  workflow_dispatch:
  push:
    paths:
      - 'Educentro/server/Dockerfile'
      - 'Educentro/server/Dockerfile.dockerignore'
      - 'Educentro/server/compose.yml'
      - 'Educentro/server/db/**'
      - 'Educentro/server/backup/**'
      - 'Educentro/server/migrations/**'
      - 'Educentro/server/secrets/generar.sh'
      - 'Educentro/js/core/**'
      - 'Educentro/js/vistas/horarios-motor.js'
      - 'Educentro/js/data/curriculo-semilla.js'
      - '.github/workflows/educentro-docker.yml'

permissions:
  contents: read

concurrency:
  group: educentro-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Educentro/server
    steps:
      - uses: actions/checkout@v4

      - name: Generar secretos efímeros y .env (solo para esta prueba)
        run: |
          bash secrets/generar.sh
          cat > .env <<'ENV'
          PUBLIC_URL=https://educentro.invalid
          MAIL_FROM=EduCentro <no-reply@educentro.invalid>
          SMTP_HOST=smtp.invalid
          ENV
          docker compose config --quiet && echo "compose.yml válido"

      - name: Construir imágenes
        run: docker compose build

      - name: La imagen no contiene datos privados ni archivos de pruebas
        run: |
          docker run --rm --entrypoint sh educentro-api:local -c '
            set -e
            test -f /app/dist/server.js
            test -f /app/js/core/calculo.js
            ! find /app -iname "*.xlsx" -o -iname "datos-privados" | grep .
            test "$(id -u)" != 0 && echo "usuario no root: $(id -un)"'

      - name: Levantar API + PostgreSQL + copias
        run: docker compose up -d

      - name: Esperar a la API sana
        run: |
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; echo "API sana"; exit 0; fi
            sleep 2
          done
          echo "::error::La API no llegó a estar sana"
          docker compose ps
          docker compose logs --no-color --tail=80
          exit 1

      - name: Comprobaciones de seguridad del despliegue
        run: |
          # La base de datos no publica ningún puerto.
          # Sin puerto publicado, `compose port` imprime ':0' y sale con éxito: solo falla si hay un puerto de host real.
          if docker compose port db 5432 2>/dev/null | grep -Eq ':[1-9][0-9]*$'; then echo "::error::db publica un puerto"; exit 1; fi
          # La API solo escucha en el bucle local del host.
          docker compose ps api --format '{{.Ports}}' | grep -q '127.0.0.1:3000' || { echo "::error::la API no está atada a 127.0.0.1"; exit 1; }
          # Las migraciones se aplicaron y el rol de la API no es propietario.
          docker compose exec -T db psql -U postgres -d educentro -Atc "select count(*) from migraciones_aplicadas" | grep -Eq '^[1-9][0-9]*$'
          docker compose exec -T db psql -U postgres -d educentro -Atc "select rolsuper, rolbypassrls from pg_roles where rolname = 'educentro_app'" | grep -q '^f|f$'
          # Un acceso sin sesión a datos debe rechazarse.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/v1/c/estudiantes)
          [ "$code" = 401 ] || { echo "::error::sin sesión debía dar 401 y dio $code"; exit 1; }
          echo "comprobaciones OK"

      - name: Registros si algo falló
        if: failure()
        run: docker compose logs --no-color --tail=120

      - name: Apagar y borrar volúmenes
        if: always()
        run: docker compose down -v
